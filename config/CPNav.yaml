task: ObjectNav
agent_cls: ObjectNavAgent
env_cls: ObjectNavEnv

agent_cfg:
  # one of ['none', 'depth_estimate', 'segmentation', 'depth_sensor']
  navigability_mode: depth_sensor

  project: true
  pivot: false
  context_history: 0
  normalize_action_scores: true
  explore_bias: 4

  vlm_score_threshold: 0.5
  model: gpt-5-nano

  meters_per_pixel: 0.005
  grid_spacing_m: 0.7
  discourage_ratio: 0.4

  # VLM-based calibration
  max_action_dist: 1.7
  min_action_dist: 0.75

  clip_frac: 1.0


  stopping_action_dist: 1.3
  default_action: 0.0

  spacing_ratio: 360
  hard_spacing: 0.349066
  num_theta: 60
  image_edge_threshold: 0.04
  turn_around_cooldown: 0
  query_image_resolution: [640, 360]

  agent_radius: 0.1
  clearance_m: 0.05
  Depth_aware: true

  navigability_height_threshold: 0.2
  map_scale: 100

  vlm_cfg:
    model_cls: ChatGPTVLM
    model_kwargs:
      model: gpt-5-nano

  action_proposer_cfg:
    clip_frac: 1.0
    num_theta: 100
    max_action_dist: 1.7
    min_action_dist: 0.75

    # Ray casting knobs
    obstacle_height_m: 0.10
    corridor_half_width_m: 0.15
    stop_margin_m: 0.05
    stride: 4

    # Angle / sensor range
    ray_max_range_m: 6.0

    # Refinement knobs
    hard_spacing_deg: 20.0


    # Explore bias (optional)
    enable: true
    weight: 1.0   # bigger => allow more close angles if unexplored

    # Projection knobs for overlay
    image_edge_threshold: 0.04    # reject endpoints near borders


sim_cfg:
  agent_height: 0.9
  agent_radius: 0.1
  allow_slide: true
  use_goal_image_agent: false

  sensor_cfg:
    height: 0.9
    pitch: -0.45
    res_factor: 1
    fov: 131
    resolution: [1080, 1920] 
  
  # Scene data is selected by env_cfg.dataset.

env_cfg:
  # ---- DATASET SWITCH ----------------------------------------------------
  # name: hm3d -> HM3D v2 scenes + ObjectNav HM3D v2 episodes
  # name: mp3d -> Matterport3D scenes + ObjectNav MP3D episodes
  dataset:
    name: hm3d
    split: val
    hm3d:
      scene_dataset_config: data/versioned_data/hm3d-0.2/hm3d/hm3d_annotated_basis.scene_dataset_config.json
      scene_root: data/versioned_data/hm3d-0.2/hm3d
      episodes_root: data/datasets/objectnav_hm3d_v2
    mp3d:
      scene_dataset_config:
      scene_root: data/MatterPort3D/mp3d
      episodes_root: data/MatterPort3D/objectnav/mp3d/v1

  num_episodes: 1
  max_steps: 20
  log_freq: 1
  success_threshold: 0.3
  instances: 1
  instance: 0
  parallel: false
  name: default
  port: 5000
  d_goal: 2.0
